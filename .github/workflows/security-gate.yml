name: security-gate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      remediacao:
        description: "Aplicar as correcoes antes de medir. Desmarque para reproduzir o BUILD VERMELHO."
        type: boolean
        default: true

permissions:
  contents: read

# Um deploy por vez. Se dois pushes entrarem juntos, o mais novo espera o
# anterior terminar em vez de os dois mexerem na VM ao mesmo tempo.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:

  # Liga/desliga as duas correcoes (patch do SQLi e override de hardening) em
  # UM lugar so. O requisito 5 da secao 5.3 exige demonstrar build vermelho E
  # verde; sem esta chave o vermelho nao era mais reproduzivel, porque
  # `push` e `pull_request` sempre aplicam as correcoes -- depois que elas
  # entraram, o pipeline passou a dar verde em toda execucao e nao havia como
  # gerar o print do vermelho de novo sem editar o workflow.
  #
  #   push / pull_request -> sempre remedia (true)
  #   workflow_dispatch   -> obedece a caixa de selecao (Actions > Run workflow)
  REMEDIAR: ${{ github.event_name != 'workflow_dispatch' || inputs.remediacao }}

jobs:
  # ------------------------------------------------------------------
  # Guarda de escopo (seção 7 do enunciado)
  # ------------------------------------------------------------------
  # DVWA é deliberadamente vulnerável. Se alguém trocar o bind de
  # 127.0.0.1 por 0.0.0.0, o deploy passaria a publicar uma aplicação
  # invadível na internet. Isso falha o build ANTES de qualquer deploy.
  #
  # A verificação vive em scripts/verificar-escopo.sh — o mesmo arquivo que o
  # deploy executa dentro da VM. Duas cópias do mesmo `grep` divergiriam.
  guarda-de-escopo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verificar que nenhuma porta do compose sai de localhost
        run: bash scripts/verificar-escopo.sh

  # ------------------------------------------------------------------
  # SAST — OpenGrep sobre o código-fonte do DVWA
  # ------------------------------------------------------------------
  sast-opengrep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Modo desta execucao
        run: echo "REMEDIAR=$REMEDIAR (false = build vermelho proposital)"

      # O mesmo script que o LAB.md manda a turma rodar. Duas formas de
      # preparar o alvo divergiriam, e o CI deixaria de testar o caminho que
      # a turma percorre.
      - name: Preparar o código-fonte do alvo
        run: bash scripts/preparar-alvo.sh

      # targets/dvwa nao esta versionado: e clonado fresco a cada execucao.
      # Aplicar o patch aqui corrige so a copia do CI -- quem rodar o
      # laboratorio localmente continua vendo o DVWA vulneravel, que e o
      # objeto de estudo da turma.
      - name: Aplicar correcoes de remediacao
        if: env.REMEDIAR == 'true'
        run: |
          cp patches/fix-sqli.php targets/dvwa/vulnerabilities/sqli/source/low.php
          echo "Patch aplicado em vulnerabilities/sqli/source/low.php"

      - name: Compilar a imagem do OpenGrep
        run: docker compose build opengrep

      - name: Rodar OpenGrep
        run: |
          mkdir -p reports
          docker compose run --rm opengrep \
            --config=p/php \
            --config=p/owasp-top-ten \
            --sarif --output=/reports/opengrep-dvwa.sarif \
            /src || true

      - uses: actions/upload-artifact@v4
        with:
          name: opengrep-sarif
          path: reports/opengrep-dvwa.sarif
          if-no-files-found: error

  # ------------------------------------------------------------------
  # DAST — Nikto contra o DVWA em execução
  # ------------------------------------------------------------------
  dast-nikto:
    runs-on: ubuntu-latest
    # COMPOSE precisa ser identico em TODAS as invocacoes deste job.
    # O servico nikto tem `depends_on: dvwa`; se `docker compose run nikto`
    # rodar sem o arquivo de override, o Compose ve que a configuracao do
    # dvwa nao bate com a do container em execucao e o RECRIA sem o volume
    # de hardening -- desfazendo a remediacao segundos antes do scan.
    #
    # Com REMEDIAR=false o override sai da lista e o DVWA sobe com o
    # directory indexing do Apache ativo: o estado do build vermelho.
    env:
      COMPOSE: ${{ (github.event_name != 'workflow_dispatch' || inputs.remediacao) && '-f docker-compose.yml -f docker-compose.hardening.yml' || '-f docker-compose.yml' }}
    steps:
      - uses: actions/checkout@v4

      - name: Modo desta execucao
        run: echo "REMEDIAR=$REMEDIAR  COMPOSE=$COMPOSE"

      - name: Subir o DVWA
        run: docker compose $COMPOSE up -d dvwa

      - name: Conferir que o hardening esta ativo
        if: env.REMEDIAR == 'true'
        run: |
          docker compose $COMPOSE exec -T dvwa \
            test -f /etc/apache2/conf-enabled/no-indexes.conf \
            || { echo "::error::Override de hardening nao foi montado."; exit 1; }
          echo "OK — no-indexes.conf presente no container."

      # O espelho da verificacao acima. Sem ele, um build vermelho que
      # subisse com o hardening por engano daria "0 achados" e seria lido
      # como "o Nikto nao encontrou nada", nao como erro de configuracao.
      - name: Conferir que o hardening NAO esta ativo
        if: env.REMEDIAR != 'true'
        run: |
          docker compose $COMPOSE exec -T dvwa \
            test ! -f /etc/apache2/conf-enabled/no-indexes.conf \
            || { echo "::error::Hardening montado numa execucao sem remediacao."; exit 1; }
          echo "OK — DVWA sem hardening, como o build vermelho exige."

      - name: Aguardar o DVWA responder
        run: |
          for i in $(seq 1 40); do
            curl -sf http://127.0.0.1:8081/ > /dev/null && exit 0
            sleep 3
          done
          echo "::error::DVWA nao respondeu em 120s."
          docker compose $COMPOSE logs dvwa
          exit 1

      - name: Rodar Nikto
        run: |
          mkdir -p reports
          docker compose $COMPOSE run --rm nikto \
            -h http://dvwa:80 \
            -Format json -o /reports/nikto-dvwa.json || true

      - name: Derrubar o ambiente
        if: always()
        run: docker compose $COMPOSE down -v

      - uses: actions/upload-artifact@v4
        with:
          name: nikto-json
          path: reports/nikto-dvwa.json
          if-no-files-found: error

  # ------------------------------------------------------------------
  # Gate de severidade — requisito 5 da seção 5.3
  # ------------------------------------------------------------------
  security-gate:
    needs: [sast-opengrep, dast-nikto, guarda-de-escopo]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { name: opengrep-sarif, path: reports }
      - uses: actions/download-artifact@v4
        with: { name: nikto-json, path: reports }

      - name: Gate SAST — nivel "error" (=HIGH) no SARIF
        id: sast
        env:
          # O gate conta so o modulo em remediacao, nao o DVWA inteiro.
          # E assim que se adota SAST em codigo legado: mede-se tudo, e o
          # gate comeca pelo que a equipe esta de fato corrigindo. Exigir
          # zero no DVWA inteiro significaria corrigir as 25 vulnerabilidades
          # que sao o objeto de estudo -- apagaria o alvo. Ampliar o escopo
          # e trocar esta linha.
          ESCOPO: 'vulnerabilities/sqli/'
        run: |
          # O OpenGrep nao escreve "level" em cada result: a severidade fica
          # na definicao da regra (tool.driver.rules[].defaultConfiguration)
          # e o result herda dela. Filtrar so por .level daria sempre zero --
          # foi o primeiro bug deste gate. Por isso montamos o mapa
          # ruleId -> level antes de contar.
          PROJECAO='
            .runs[]
            | (reduce (.tool.driver.rules[]?) as $r ({};
                  .[$r.id] = $r.defaultConfiguration.level)) as $lv
            | .results[]
            | { nivel:   (.level // $lv[.ruleId] // "warning"),
                regra:   (.ruleId // "?"),
                arquivo: (.locations[0].physicalLocation.artifactLocation.uri // ""),
                linha:   (.locations[0].physicalLocation.region.startLine // 0) }
          '
          NO_ESCOPO="[ $PROJECAO | select(.nivel == \"error\")
                       | select(.arquivo | contains(\$escopo)) ]"

          N=$(jq --arg escopo "$ESCOPO" "$NO_ESCOPO | length" \
                 reports/opengrep-dvwa.sarif)
          TOTAL_GERAL=$(jq "[ $PROJECAO | select(.nivel == \"error\") ] | length" \
                 reports/opengrep-dvwa.sarif)

          echo "OpenGrep: $N achado(s) HIGH em $ESCOPO (de $TOTAL_GERAL no DVWA inteiro)"

          # Lista o que foi contado. Sem isso o print do build vermelho
          # mostra um numero sem dizer de onde ele veio.
          jq -r --arg escopo "$ESCOPO" \
             "$NO_ESCOPO | .[] | \"  - \(.arquivo):\(.linha)  \(.regra)\"" \
             reports/opengrep-dvwa.sarif

          {
            echo "count=$N"
            echo "total=$TOTAL_GERAL"
            echo "escopo=$ESCOPO"
          } >> "$GITHUB_OUTPUT"

      - name: Gate DAST — achados da lista NIKTO_HIGH
        id: dast
        run: |
          # `\.git` sozinho casava com ".gitignore file found", um achado de
          # severidade baixa -- falso positivo da POLITICA do grupo, nao do
          # Nikto. O que importa e o diretorio /.git/ exposto, que vaza o
          # historico do codigo. Por isso a barra final.
          RE='phpinfo|/admin|Directory indexing|backup|/\.git/|test/|Default account'

          # O teste roda sobre url + msg, nao so sobre msg.
          #
          # No Nikto 2.1.5 a mensagem repetia o caminho ("GET /config/:
          # /config/: Directory indexing found."), entao casar so em .msg
          # funcionava por acidente. No 2.5.0 -- a versao que gerou o
          # relatorio versionado -- o caminho ficou apenas em .url, e os
          # padroes de caminho da lista (/admin, /.git/, backup, test/)
          # deixaram de casar com qualquer coisa: o gate nao reprovaria nem
          # um /.git/ exposto. Concatenar os dois campos devolve a intencao
          # da politica sem mudar o veredito dos relatorios ja versionados
          # (conferido nos dois: 2 achados antes e depois da mudanca).
          FILTRO='[ .. | objects | select(has("msg"))
                    | { url: (.url // "-"), msg: .msg }
                    | select((.url + " " + .msg) | test($re; "i")) ]'

          N=$(jq --arg re "$RE" "$FILTRO | length" reports/nikto-dvwa.json)
          echo "Nikto: $N achado(s) HIGH"
          jq -r --arg re "$RE" "$FILTRO | .[] | \"  - \(.url)  \(.msg)\"" \
             reports/nikto-dvwa.json

          echo "count=$N" >> "$GITHUB_OUTPUT"

      - name: Decisao do gate
        env:
          SAST_COUNT: ${{ steps.sast.outputs.count }}
          SAST_TOTAL: ${{ steps.sast.outputs.total }}
          SAST_ESCOPO: ${{ steps.sast.outputs.escopo }}
          DAST_COUNT: ${{ steps.dast.outputs.count }}
        run: |
          TOTAL=$(( SAST_COUNT + DAST_COUNT ))
          echo "SAST=$SAST_COUNT  DAST=$DAST_COUNT  TOTAL=$TOTAL"

          # O resumo do job e o que vale como evidencia de build vermelho e
          # verde: e mais legivel num print do que o log cru.
          {
            echo "### Gate de severidade"
            echo ""
            echo "Remediacao aplicada nesta execucao: \`$REMEDIAR\`"
            echo ""
            echo "| Ferramenta | Escopo contado | Achados HIGH |"
            echo "|---|---|---|"
            echo "| OpenGrep (SAST) | \`$SAST_ESCOPO\` — $SAST_TOTAL no DVWA inteiro | $SAST_COUNT |"
            echo "| Nikto (DAST) | lista NIKTO_HIGH | $DAST_COUNT |"
            echo "| **Total** | | **$TOTAL** |"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$TOTAL" -gt 0 ]; then
            echo "**REPROVADO — deploy bloqueado.**" >> "$GITHUB_STEP_SUMMARY"
            echo "::error::Gate REPROVADO — $TOTAL achado(s) de severidade HIGH. Deploy bloqueado."
            exit 1
          fi
          echo "**APROVADO — nenhum achado HIGH.**" >> "$GITHUB_STEP_SUMMARY"
          echo "Gate APROVADO — nenhum achado HIGH."

  # ------------------------------------------------------------------
  # Os secrets do deploy existem? (o contexto `secrets` nao pode ser
  # lido em `if:` de job, entao vira output deste job)
  # ------------------------------------------------------------------
  config-do-deploy:
    needs: security-gate
    runs-on: ubuntu-latest
    outputs:
      configurado: ${{ steps.check.outputs.configurado }}
    steps:
      - id: check
        env:
          HOST: ${{ secrets.AZURE_VM_HOST }}
          USER: ${{ secrets.AZURE_VM_USER }}
          KEY: ${{ secrets.AZURE_VM_SSH_KEY }}
        run: |
          if [ -n "$HOST" ] && [ -n "$USER" ] && [ -n "$KEY" ]; then
            echo "configurado=true" >> "$GITHUB_OUTPUT"
          else
            echo "configurado=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Secrets do deploy ausentes — job de deploy sera pulado."
          fi

  # ------------------------------------------------------------------
  # Deploy na VM Azure — so em push na main, e so com o gate verde
  # ------------------------------------------------------------------
  deploy:
    needs: [security-gate, config-do-deploy]
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.config-do-deploy.outputs.configurado == 'true'
    runs-on: ubuntu-latest
    environment: producao
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.AZURE_VM_HOST }}
          username: ${{ secrets.AZURE_VM_USER }}
          key: ${{ secrets.AZURE_VM_SSH_KEY }}
          script_stop: true
          script: |
            set -euo pipefail
            APP_DIR=/opt/CP1_DEV_SEC_OPS

            # O diretorio precisa existir e pertencer ao usuario do deploy.
            # Isso e feito uma unica vez, na preparacao da VM (ver DEPLOY.md),
            # para que o workflow nao precise de sudo sem senha.
            if [ ! -w "$APP_DIR" ]; then
              echo "ERRO: $APP_DIR nao existe ou nao e gravavel por $(id -un)."
              echo "Rode a preparacao da VM descrita em DEPLOY.md."
              exit 1
            fi

            # Primeira execucao: clona. Demais: atualiza.
            if [ ! -d "$APP_DIR/.git" ]; then
              git clone https://github.com/Snake-arch57/CP1_DEV_SEC_OPS.git "$APP_DIR"
            fi

            cd "$APP_DIR"
            git fetch --all
            git reset --hard origin/main

            # Mesma guarda de escopo, agora na VM: nao subir nada que
            # publique o DVWA fora de localhost. E o mesmo script do job
            # `guarda-de-escopo`, e aqui ele roda no modo estrito, porque a
            # VM tem docker instalado.
            bash scripts/verificar-escopo.sh

            # So o DVWA roda na VM. O opengrep e o nikto sao ferramentas de
            # analise, usadas no CI e no laboratorio local -- nao sao servicos
            # da aplicacao. Buildar a imagem do OpenGrep aqui gastaria minutos
            # e disco a cada deploy sem nenhum uso, e o servico monta
            # ./targets/dvwa, que nao existe na VM.
            # O mesmo override de remediacao que o gate validou. Sem ele, a
            # VM receberia uma versao diferente da que passou no gate.
            docker compose -f docker-compose.yml -f docker-compose.hardening.yml \
              pull dvwa
            docker compose -f docker-compose.yml -f docker-compose.hardening.yml \
              up -d --force-recreate dvwa
            docker compose -f docker-compose.yml -f docker-compose.hardening.yml \
              ps dvwa

      - name: Resumo
        run: |
          echo "### Deploy concluido na VM Azure" >> "$GITHUB_STEP_SUMMARY"
          echo "Commit: \`${{ github.sha }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "DVWA escuta em \`127.0.0.1:8081\` na VM — acesso so por tunel SSH:" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo 'ssh -L 8081:127.0.0.1:8081 usuario@<ip-da-vm>' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
