# Nome do projeto fixo. Sem isso o Compose o deriva do nome do diretorio, e
# renomear a pasta faz ele tratar os containers existentes como de outro
# projeto -- nao consegue reutilizar o `container_name: dvwa` e falha com
# "container name is already in use". Foi o que quebrou o deploy quando
# /opt/checkpoint01-grupo1 virou /opt/CP1_DEV_SEC_OPS.
name: cp1

services:
  dvwa:
    image: vulnerables/web-dvwa:latest
    container_name: dvwa
    ports:
      - "127.0.0.1:8081:80"
    networks:
      - lab

  opengrep:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: opengrep
    volumes:
      - ./targets/dvwa:/src:ro
      - ./reports:/reports
    networks:
      - lab

  nikto:
    image: hysnsec/nikto:latest
    container_name: nikto
    volumes:
      - ./reports:/reports
    networks:
      - lab
    depends_on:
      - dvwa

networks:
  lab:
    driver: bridge
