# Desabilita o directory indexing do Apache.
#
# Corrige os dois achados do Nikto em /config/ e /docs/:
#   "Directory indexing found."
#
# CWE-548 (Exposure of Information Through Directory Listing). O caso de
# /config/ e o mais grave: e onde o DVWA guarda a configuracao do banco.
#
# Repare que isso nao esta no codigo PHP -- e configuracao do servidor web.
# Nenhuma analise estatica acusaria: so o DAST, batendo na aplicacao no ar,
# encontra esse tipo de problema. E o contraste central do laboratorio.

<Directory /var/www/html>
    Options -Indexes
</Directory>
